name: Validate Entry Execution Safety V1

on:
  pull_request:
    paths:
      - "bot/entry_execution_safety_v1_patch.py"
      - "tests/test_entry_execution_safety_v1.py"
      - "main.py"
      - ".github/workflows/validate-entry-execution-safety-v1.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed Python
        run: |
          python -m py_compile bot/entry_execution_safety_v1_patch.py
          python -m py_compile tests/test_entry_execution_safety_v1.py
          python -m py_compile main.py
      - name: Run focused safety tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_entry_execution_safety_v1.py
