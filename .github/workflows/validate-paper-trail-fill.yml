name: Validate PAPER Trail Fill

on:
  pull_request:
    paths:
      - "bot/authoritative_profit_lock_runtime_patch.py"
      - "tests/test_authoritative_profit_lock_v3.py"
      - ".github/workflows/validate-paper-trail-fill.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile runtime patch
        run: python -m py_compile bot/authoritative_profit_lock_runtime_patch.py
      - name: Run focused regression tests
        run: pytest -q tests/test_authoritative_profit_lock_v3.py
