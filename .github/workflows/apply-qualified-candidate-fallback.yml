name: Apply Qualified Candidate Fallback Fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-qualified-candidate-fallback.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply candidate fallback patch
        run: python scripts/apply_qualified_candidate_fallback.py

      - name: Validate fallback behavior
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile bot/auto_portfolio_runtime.py
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          pytest -q tests/test_qualified_candidate_fallback.py tests/test_entry_execution_safety_v1.py tests/test_entry_momentum_scan_cycle_fix.py
          git diff --check

      - name: Commit repaired runtime
        run: |
          if git diff --quiet; then
            echo "Candidate fallback already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/auto_portfolio_runtime.py tests/test_qualified_candidate_fallback.py
          git commit -m "Try all qualified indices before skipping entry"
          git push origin HEAD:main
