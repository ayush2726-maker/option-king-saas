name: Remove Premium Entry Gate V3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-premium-entry-gate-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove premium confirmation and quality blocking
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("bot/entry_execution_safety_v1_patch.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              '1. Selected option premium must show a real uptick before BUY.',
              '1. Qualified strategy entries do not use a premium momentum/quality gate.',
              1,
          )
          text = text.replace(
              'PATCH_VERSION = "ENTRY_EXECUTION_SAFETY_V2_BALANCED_PREMIUM"',
              'PATCH_VERSION = "ENTRY_EXECUTION_SAFETY_V3_NO_PREMIUM_GATE"',
              1,
          )

          anchor = '''def _clear_momentum(user_id: int, broker_name: str, symbol: str) -> None:\n'''
          helper = '''def _premium_gate_disabled(\n    quote_price: float,\n    observed_quality: dict[str, Any] | None = None,\n) -> dict[str, Any]:\n    """Audit-only premium snapshot; never blocks a qualified strategy entry."""\n    quality = dict(observed_quality or {})\n    return {\n        "allowed": True,\n        "reason": "OPTION_PREMIUM_GATE_DISABLED",\n        "gate_enabled": False,\n        "current_price": round(_f(quote_price), 4),\n        "observed_quality_allowed": bool(quality.get("allowed", True)),\n        "observed_quality_reason": quality.get("reason"),\n    }\n\n\n'''
          if "def _premium_gate_disabled(" not in text:
              if anchor not in text:
                  raise SystemExit("Premium helper insertion anchor not found")
              text = text.replace(anchor, helper + anchor, 1)

          old_quality = '''        quality_copy = dict(quality or {})\n'''
          new_quality = '''        quality_observed = dict(quality or {})\n        quality_copy = dict(quality_observed)\n        quality_copy.update({\n            "allowed": True,\n            "reason": "OPTION_PREMIUM_GATE_DISABLED",\n            "premium_gate_disabled": True,\n            "observed_allowed": bool(quality_observed.get("allowed", True)),\n            "observed_reason": quality_observed.get("reason"),\n        })\n'''
          if old_quality in text:
              text = text.replace(old_quality, new_quality, 1)
          elif "quality_observed = dict(quality or {})" not in text:
              raise SystemExit("Quality-copy anchor not found")

          old_health_call = '''        option_candle_health = _quality_transport_state(\n            user_id,\n            broker_name,\n            quality_copy,\n        )\n'''
          new_health_call = '''        option_candle_health = _quality_transport_state(\n            user_id,\n            broker_name,\n            quality_observed,\n        )\n'''
          if old_health_call in text:
              text = text.replace(old_health_call, new_health_call, 1)

          old_health_block = '''            "blocked": bool(\n                candle_health.get("blocked")\n                or quote_health.get("blocked")\n                or option_candle_health.get("blocked")\n            ),\n'''
          new_health_block = '''            "blocked": bool(\n                candle_health.get("blocked")\n                or quote_health.get("blocked")\n            ),\n'''
          if old_health_block in text:
              text = text.replace(old_health_block, new_health_block, 1)
          elif 'or option_candle_health.get("blocked")' in text:
              raise SystemExit("Option-candle health block removal failed")

          old_momentum = '''        momentum = _momentum_check(\n            user_id,\n            broker_name,\n            symbol,\n            quote_price,\n        )\n        momentum = _balanced_momentum_policy(\n            momentum,\n            quality_copy,\n        )\n'''
          new_momentum = '''        momentum = _premium_gate_disabled(\n            quote_price,\n            quality_observed,\n        )\n'''
          if old_momentum in text:
              text = text.replace(old_momentum, new_momentum, 1)
          elif "momentum = _premium_gate_disabled(" not in text:
              raise SystemExit("Premium momentum call anchor not found")

          old_reason = '''        reason = _guard_reason(health, candle)\n        if reason is None and not quality_copy.get("allowed", True):\n            reason = _text(\n                quality_copy.get("reason"),\n                "OPTION_QUALITY_BLOCKED",\n            )\n        if reason is None and not momentum.get("allowed"):\n            reason = _text(\n                momentum.get("reason"),\n                "OPTION_PREMIUM_MOMENTUM_WEAK",\n            )\n'''
          new_reason = '''        # Premium momentum and premium-candle quality are audit-only.\n        # A qualified strategy entry is blocked here only for stale index data\n        # or repeated broker quote/candle transport failure.\n        reason = _guard_reason(health, candle)\n'''
          if old_reason in text:
              text = text.replace(old_reason, new_reason, 1)
          elif 'not quality_copy.get("allowed", True)' in text or 'not momentum.get("allowed")' in text:
              raise SystemExit("Premium blocking reason removal failed")

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_premium_gate_removed_v3.py")
          test_path.write_text(
              '''import inspect\n\nfrom bot import entry_execution_safety_v1_patch as patch\n\n\ndef test_disabled_premium_snapshot_never_blocks():\n    snapshot = patch._premium_gate_disabled(\n        101.25,\n        {\n            "allowed": False,\n            "reason": "OPTION_SPIKE_REVERSING",\n        },\n    )\n    assert snapshot["allowed"] is True\n    assert snapshot["gate_enabled"] is False\n    assert snapshot["reason"] == "OPTION_PREMIUM_GATE_DISABLED"\n    assert snapshot["observed_quality_allowed"] is False\n\n\ndef test_final_execution_wrapper_has_no_premium_block():\n    source = inspect.getsource(\n        patch.apply_entry_execution_safety_v1_patch\n    )\n    assert 'not quality_copy.get("allowed", True)' not in source\n    assert 'not momentum.get("allowed")' not in source\n    assert 'or option_candle_health.get("blocked")' not in source\n    assert "momentum = _premium_gate_disabled(" in source\n''',
              encoding="utf-8",
          )
          PY

      - name: Validate no-premium-gate entry behavior
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile bot/entry_execution_safety_v1_patch.py
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          pytest -q \
            tests/test_premium_gate_removed_v3.py \
            tests/test_entry_execution_safety_v1.py \
            tests/test_balanced_premium_entry_gate_v2.py \
            tests/test_qualified_candidate_fallback.py
          git diff --check

      - name: Commit premium gate removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/entry_execution_safety_v1_patch.py tests/test_premium_gate_removed_v3.py
          git rm .github/workflows/remove-premium-entry-gate-v3.yml
          git commit -m "Remove premium gate from qualified AUTO entries"
          git push origin HEAD:main
