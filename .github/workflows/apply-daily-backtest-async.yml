name: Apply Daily Backtest Async

on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/daily-backtest-async.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire daily async patch into server boot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('main.py')
          s = p.read_text()
          imp = 'from backtest.daily_job_start_patch import apply_daily_job_start_patch\n'
          if imp not in s:
              anchor = 'from backtest.monthly_job_start_patch import apply_monthly_job_start_patch\n'
              if anchor not in s:
                  raise SystemExit('monthly import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          call = 'apply_daily_job_start_patch()\n'
          if call not in s:
              anchor = 'apply_monthly_job_start_patch()\n'
              if anchor not in s:
                  raise SystemExit('monthly apply anchor missing')
              s = s.replace(anchor, anchor + call, 1)
          p.write_text(s)
          PY
      - name: Validate Python syntax
        run: |
          python -m py_compile backtest/daily_job_start_patch.py main.py
      - name: Commit server wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add main.py backtest/daily_job_start_patch.py
          git diff --cached --quiet && exit 0
          git commit -m 'Use async job flow for daily backtest'
          git push
