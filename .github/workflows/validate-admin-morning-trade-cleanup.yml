name: Validate Admin Morning Trade Cleanup

on:
  pull_request:
    paths:
      - "bot/admin_morning_trade_cleanup_20260804.py"
      - "tests/test_admin_morning_trade_cleanup_20260804.py"
      - "main.py"
      - ".github/workflows/validate-admin-morning-trade-cleanup.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile cleanup and startup integration
        run: python -m py_compile bot/admin_morning_trade_cleanup_20260804.py main.py
      - name: Run exact deletion regressions
        run: python -m pytest -q tests/test_admin_morning_trade_cleanup_20260804.py
