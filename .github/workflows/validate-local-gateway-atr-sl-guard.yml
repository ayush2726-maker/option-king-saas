name: Validate Local Gateway ATR SL Guard

on:
  pull_request:
    paths:
      - 'local_gateway_agent/sitecustomize.py'
      - 'tests/test_local_gateway_atr_sl_guard.py'
      - '.github/workflows/validate-local-gateway-atr-sl-guard.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile safety add-on
        run: python -m py_compile local_gateway_agent/sitecustomize.py
      - name: Run ATR SL guard tests
        run: python -m pytest -q tests/test_local_gateway_atr_sl_guard.py
