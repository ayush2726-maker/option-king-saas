name: Validate Opening ORB Loss Circuit

on:
  pull_request:
    paths:
      - 'bot/opening_orb_loss_circuit_patch.py'
      - 'bot/decision_score_display_consistency_patch.py'
      - 'tests/test_opening_orb_loss_circuit.py'
      - '.github/workflows/validate-opening-orb-loss-circuit.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed Python
        run: |
          python -m py_compile bot/opening_orb_loss_circuit_patch.py
          python -m py_compile bot/decision_score_display_consistency_patch.py
          python -m py_compile tests/test_opening_orb_loss_circuit.py
      - name: Run opening and cooldown regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_opening_orb_loss_circuit.py
