name: Fix Upstox Candle Order Entry V6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-upstox-candle-order-entry-v6.yml"
      - "scripts/fix_upstox_candle_order_entry_v6.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Upstox candle-order fix
        run: python scripts/fix_upstox_candle_order_entry_v6.py
      - name: Validate Upstox AUTO entry path
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile bot/angel_fetcher.py
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          pytest -q tests/test_upstox_candle_order_entry_v6.py tests/test_qualified_candidate_fallback.py tests/test_upstox_final_entry_reason_visibility.py
          git diff --check
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Upstox candle-order fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/angel_fetcher.py tests/test_upstox_candle_order_entry_v6.py
          git commit -m "Fix Upstox AUTO candle order and stale entry blocks"
          git push origin HEAD:main
