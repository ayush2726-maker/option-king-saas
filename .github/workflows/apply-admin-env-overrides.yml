name: Apply Admin Access Overrides

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-admin-env-overrides.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/patch_admin_env_overrides.py
      - name: Validate
        run: |
          python -m py_compile main.py
          grep -q 'ADMIN_DEACTIVATE_EMAILS' main.py
      - name: Commit patch
        run: |
          rm -f scripts/patch_admin_env_overrides.py
          rm -f .github/workflows/apply-admin-env-overrides.yml
          git config user.name "okai-admin-access-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply admin demotion and subscription override controls"
          git push origin HEAD:main
