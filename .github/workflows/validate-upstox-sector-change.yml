name: Validate Upstox Sector Change

on:
  pull_request:
    paths:
      - "bot/upstox_sector_change_fix_v1.py"
      - "bot/__init__.py"
      - "tests/test_upstox_sector_change_fix_v1.py"
      - ".github/workflows/validate-upstox-sector-change.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile display-data patch
        run: python -m py_compile bot/upstox_sector_change_fix_v1.py
      - name: Run focused regression tests
        run: python -m pytest -q tests/test_upstox_sector_change_fix_v1.py
