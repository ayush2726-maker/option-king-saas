name: Validate Real 5m MTF Session Guard

on:
  pull_request:
    paths:
      - "bot/real_mtf_session_guard_patch.py"
      - "bot/decision_score_display_consistency_patch.py"
      - "tests/test_real_mtf_session_guard.py"
      - ".github/workflows/validate-real-mtf-session-guard.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed Python
        run: |
          python -m py_compile bot/real_mtf_session_guard_patch.py
          python -m py_compile bot/decision_score_display_consistency_patch.py
          python -m py_compile tests/test_real_mtf_session_guard.py
      - name: Run real MTF and cutoff regression tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_real_mtf_session_guard.py
