name: Validate PAPER Market Close 15:30

on:
  pull_request:
    paths:
      - "bot/paper_market_close_1530_patch.py"
      - "bot/supertrend_neutral_line_fallback_patch.py"
      - "tests/test_paper_market_close_1530_patch.py"
      - ".github/workflows/validate-paper-market-close-1530.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile runtime patches
        run: |
          python -m py_compile \
            bot/paper_market_close_1530_patch.py \
            bot/supertrend_neutral_line_fallback_patch.py

      - name: Run PAPER and LIVE time-window tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_paper_market_close_1530_patch.py
