name: Validate Local Gateway First Lock 4pct

on:
  pull_request:
    paths:
      - 'local_gateway_agent/okai_local_gateway_v2.py'
      - 'local_gateway_agent/okai_local_gateway_v3.py'
      - 'tests/test_local_gateway_first_lock_4pct.py'
      - '.github/workflows/validate-local-gateway-first-lock-4pct.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile gateway files
        run: |
          python -m py_compile local_gateway_agent/okai_local_gateway_v2.py
          python -m py_compile local_gateway_agent/okai_local_gateway_v3.py
      - name: Run focused first-lock tests
        run: pytest -q tests/test_local_gateway_first_lock_4pct.py
