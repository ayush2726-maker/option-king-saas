name: Validate Bullish Balance and CAS Guard

on:
  push:
    branches: [main]
    paths:
      - "bot/bullish_balance_cas_guard_patch.py"
      - "tests/test_bullish_balance_cas_guard.py"
      - "main.py"
      - ".github/workflows/validate-bullish-balance-cas.yml"
  pull_request:
    paths:
      - "bot/bullish_balance_cas_guard_patch.py"
      - "tests/test_bullish_balance_cas_guard.py"
      - "main.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed runtime
        run: |
          python -m py_compile bot/bullish_balance_cas_guard_patch.py
          python -m py_compile tests/test_bullish_balance_cas_guard.py
          python -m py_compile main.py
      - name: Run focused regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_bullish_balance_cas_guard.py
          if [ -f tests/test_real_mtf_session_guard.py ]; then
            pytest -q tests/test_real_mtf_session_guard.py
          fi
          if [ -f tests/test_opening_orb_loss_circuit_guard.py ]; then
            pytest -q tests/test_opening_orb_loss_circuit_guard.py
          fi
