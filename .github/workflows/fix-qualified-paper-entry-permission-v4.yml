name: Fix Qualified Paper Entry Permission V4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-qualified-paper-entry-permission-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unblock qualified paper entries and persist exact failure stages
        run: |
          python - <<'PY'
