name: Fix Qualified Paper Entry Permission V4

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-qualified-paper-entry-permission-v4.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply qualified paper entry fix
        run: python .github/scripts/fix_qualified_paper_entry_permission_v4.py

      - name: Validate entry permission and diagnostics
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile bot/auto_portfolio_runtime.py
          python -m pip install -q -r requirements.txt
          python -m pip install -q pytest
          pytest -q \
            tests/test_qualified_paper_entry_permission_v4.py \
            tests/test_qualified_candidate_fallback.py \
            tests/test_upstox_final_entry_reason_visibility.py
          git diff --check

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "Qualified paper entry fix already present"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot/auto_portfolio_runtime.py tests/test_qualified_paper_entry_permission_v4.py
          git commit -m "Unblock qualified paper entries and expose exact failures"
          git push origin HEAD:main
