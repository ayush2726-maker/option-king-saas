name: Apply Admin Subscription Deactivation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-admin-deactivate-subscription.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch
        run: python scripts/patch_admin_deactivate_subscription.py
      - name: Validate
        run: |
          python -m py_compile admin/routes.py
          grep -q 'deactivate-subscription' admin/routes.py
      - name: Commit patch
        run: |
          rm -f scripts/patch_admin_deactivate_subscription.py
          rm -f .github/workflows/apply-admin-deactivate-subscription.yml
          git config user.name "okai-admin-subscription-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add admin subscription deactivation endpoint"
          git push origin HEAD:main
