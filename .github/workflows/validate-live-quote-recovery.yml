name: Validate Live Quote Recovery

on:
  pull_request:
    paths:
      - "bot/live_quote_runtime_recovery.py"
      - "main.py"
      - "tests/test_live_quote_runtime_recovery.py"
      - ".github/workflows/validate-live-quote-recovery.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Compile changed Python
        run: |
          python -m py_compile bot/live_quote_runtime_recovery.py
          python -m py_compile main.py
          python -m py_compile tests/test_live_quote_runtime_recovery.py
      - name: Run live quote recovery regressions
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_live_quote_runtime_recovery.py
