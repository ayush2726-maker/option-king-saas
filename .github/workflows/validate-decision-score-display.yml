name: Validate Decision Score Display

on:
  pull_request:
    paths:
      - "bot/decision_score_display_consistency_patch.py"
      - "bot/live_score_breakdown_patch.py"
      - "bot/strategy.py"
      - "main.py"
      - "tests/test_decision_score_display_consistency.py"
      - "tests/test_volume_availability_normalization.py"
      - ".github/workflows/validate-decision-score-display.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile score consistency code
        run: |
          python -m py_compile bot/strategy.py bot/live_score_breakdown_patch.py bot/decision_score_display_consistency_patch.py main.py
      - name: Run decision/display regression tests
        run: pytest -q tests/test_decision_score_display_consistency.py tests/test_volume_availability_normalization.py
      - name: Import complete FastAPI application
        run: python -c "import main; print(main.RELEASE_VERSION)"
