name: Validate Live Current Capital

on:
  pull_request:
    paths:
      - "bot/live_signal_broker_truth_middleware.py"
      - "bot/authoritative_ledger.py"
      - "tests/test_live_signal_current_capital_v3.py"
      - ".github/workflows/validate-live-current-capital.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile capital response code
        run: |
          python -m py_compile \
            bot/live_signal_broker_truth_middleware.py \
            bot/authoritative_ledger.py \
            tests/test_live_signal_current_capital_v3.py

      - name: Validate LIVE capital source and fallbacks
        run: |
          python -m pytest -q \
            tests/test_live_signal_current_capital_v3.py \
            tests/test_authoritative_ledger.py \
            tests/test_current_capital_status_v1.py
