name: Validate Sector Rotation AI Training

on:
  pull_request:
    paths:
      - "bot/sector_rotation_ai_training_v1.py"
      - "bot/__init__.py"
      - "tests/test_sector_rotation_ai_training_v1.py"
      - ".github/workflows/validate-sector-rotation-ai-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile training collector
        run: python -m py_compile bot/sector_rotation_ai_training_v1.py
      - name: Run focused regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_sector_rotation_ai_training_v1.py
