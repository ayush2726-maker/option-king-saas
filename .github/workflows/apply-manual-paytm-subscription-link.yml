name: Apply Manual Paytm Subscription Link

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_manual_paytm_subscription_link.py"
      - ".github/workflows/apply-manual-paytm-subscription-link.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 scripts/patch_manual_paytm_subscription_link.py
          python3 -m py_compile subscription/razorpay_routes.py
          grep -q 'gateway": "paytm_payment_link"' subscription/razorpay_routes.py
      - name: Commit patch
        run: |
          if git diff --quiet -- subscription/razorpay_routes.py; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription/razorpay_routes.py
          git commit -m "Use manual Paytm link for subscriptions"
          git push origin HEAD:main
