name: Apply Gateway Provisioning Router
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/gateway-provisioning-router.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_gateway_provisioning_router.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git diff --cached --quiet || git commit -m "Wire automatic gateway provisioning router"
          git push
